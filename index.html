<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UK Settle-In Journey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,500&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#122040; --ink-2:#1c2f57; --paper:#EDEFE7; --paper-2:#F6F7F1; --card:#FFFFFF;
    --red:#C8102E; --gold:#A9843F; --green:#2F6B4F; --line:#D7D9CC; --text:#1B2233; --text-soft:#5B6376;
    --radius:14px; --shadow: 0 1px 2px rgba(18,32,64,.06), 0 8px 24px rgba(18,32,64,.06);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--text);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  ::selection{background:var(--gold);color:#fff;}
  a{color:inherit;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  .topbar{position:sticky;top:0;z-index:50;background:var(--ink);border-bottom:3px solid var(--gold);}
  .topbar-inner{max-width:980px;margin:0 auto;padding:12px 16px;display:flex;flex-direction:column;gap:14px;}
  .topbar-row1{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:8px;color:#EFE9D8;font-family:'Newsreader',serif;font-weight:600;font-size:16px;flex-shrink:0;}
  .brand .flag{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gold);}
  .controls{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end;flex-wrap:wrap;}

  .locate-box{display:flex;gap:8px;flex:1;justify-content:flex-end;}
  #cityInput{width:100%;max-width:320px;padding:12px 14px;border:none;border-radius:9px;font-size:15px;font-family:'Inter',sans-serif;background:var(--paper-2);color:var(--text);}
  #cityInput:focus{outline:2px solid var(--gold);}
  #stampBtn{padding:12px 18px;background:var(--red);color:#fff;border:none;border-radius:9px;font-weight:600;font-size:13.5px;cursor:pointer;font-family:'Inter',sans-serif;flex-shrink:0;}
  #stampBtn:hover{background:#a80d26;}

  .location-pill{display:none;align-items:center;gap:8px;background:var(--paper-2);border-radius:20px;padding:8px 8px 8px 14px;font-size:13.5px;color:var(--text);white-space:nowrap;}
  .location-pill.show{display:flex;}
  .location-pill button{border:none;background:var(--ink);color:#EFE9D8;font-size:11px;padding:6px 10px;border-radius:14px;cursor:pointer;font-family:'Inter',sans-serif;}

  .search-wrap{max-width:980px;margin:0 auto;padding:16px 16px 20px;}
  .search-box{position:relative;width:50%;min-width:260px;}
  #searchInput{width:100%;padding:12px 14px 12px 36px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:'Inter',sans-serif;background:var(--card);color:var(--text);box-shadow:var(--shadow);}
  #searchInput:focus{outline:2px solid var(--ink);}
  .search-box::before{content:"🔎";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:13px;pointer-events:none;}

  main{max-width:980px;margin:0 auto;padding:8px 16px 60px;}

  .home-btn{position:fixed;right:18px;bottom:18px;width:46px;height:46px;border-radius:50%;background:var(--ink);color:#EFE9D8;border:2px solid var(--gold);font-size:19px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:var(--shadow);z-index:60;}
  .home-btn.show{display:flex;}
  .home-btn:hover{background:var(--ink-2);}

  .chapter{position:relative;padding-left:54px;margin-bottom:44px;scroll-margin-top:16px;}
  .chapter::before{content:"";position:absolute;left:19px;top:44px;bottom:-44px;width:2px;background:repeating-linear-gradient(to bottom, var(--gold) 0 6px, transparent 6px 12px);}
  .chapter:last-child::before{display:none;}
  .chapter-node{position:absolute;left:0;top:0;width:40px;height:40px;border-radius:50%;background:var(--ink);color:#EFE9D8;display:flex;align-items:center;justify-content:center;font-family:'Newsreader',serif;font-weight:600;font-size:15px;border:2px solid var(--gold);z-index:1;}
  .chapter-eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
  .chapter-title{font-family:'Newsreader',serif;font-size:22px;font-weight:600;margin:0 0 12px;}

  section.task-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:12px;}
  .task-head{display:flex;align-items:center;gap:12px;cursor:pointer;}
  .task-icon{width:34px;height:34px;border-radius:9px;background:var(--paper-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;color:var(--red);}
  .task-head h3{font-family:'Newsreader',serif;font-size:16.5px;font-weight:600;margin:0;}
  .task-head p.deck{margin:0;font-size:12.5px;color:var(--text-soft);line-height:1.3;}
  .chev{margin-left:auto;font-size:16px;color:var(--text-soft);transition:transform .2s ease;}
  .task-card.open .chev{transform:rotate(180deg);}
  .task-body{display:none;padding-top:14px;}
  .task-card.open .task-body{display:block;}

  .find-btn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#fff;background:var(--ink);padding:7px 12px;border-radius:8px;text-decoration:none;margin-bottom:12px;}
  .find-btn:hover{background:var(--ink-2);}

  .region-tag{display:inline-flex;align-items:center;gap:6px;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.04em;color:var(--green);background:#EAF3EE;border:1px solid #C7DED2;padding:4px 9px;border-radius:7px;margin-bottom:10px;}
  .region-tag.generic{color:var(--text-soft);background:var(--paper-2);border-color:var(--line);}

  .provider-grid{display:flex;flex-wrap:wrap;gap:10px;}
  .provider{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:22px;padding:5px 12px 5px 5px;background:var(--paper-2);cursor:pointer;transition:border-color .15s ease;}
  .provider:hover{border-color:var(--ink);}
  .provider.nearest{border-color:var(--gold);background:#FBF6E9;}
  .p-icon{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#EFE9D8;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:11px;flex-shrink:0;}
  .provider.nearest .p-icon{background:var(--red);}
  .p-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;}
  .p-tag{font-size:10px;color:var(--text-soft);white-space:nowrap;}

  .tip{margin-top:10px;font-size:11.5px;color:var(--text-soft);}

  .rules-list{margin:0;padding:0;list-style:none;}
  .rules-list li{font-size:13px;line-height:1.6;padding:9px 0;border-bottom:1px dashed var(--line);}
  .rules-list li:last-child{border-bottom:none;}
  .rules-list b{color:var(--ink);}

  .glossary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:9px;}
  .gloss-item{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--paper-2);}
  .gloss-item .phrase{font-family:'Newsreader',serif;font-weight:600;font-size:14.5px;color:var(--ink);}
  .gloss-item .meaning{font-size:12.5px;color:var(--text-soft);margin-top:2px;line-height:1.45;}

  @media (max-width:560px){
    .chapter{padding-left:44px;}
    .chapter::before{left:15px;}
    .chapter-node{width:32px;height:32px;font-size:12px;}
    .chapter-title{font-size:19px;}
    .search-box{width:100%;min-width:0;}
    #cityInput{max-width:none;}
  }
</style>
</head>

<div class="topbar">
  <div class="topbar-inner">
    <div class="topbar-row1">
      <div class="brand"><span class="flag">UK</span> Settle-In</div>
      <div class="controls">
        <div class="locate-box" id="locateBox">
          <input id="cityInput" type="text" placeholder="City or postcode" autocomplete="off">

        </div>

    </div>

</div>

<div class="search-wrap">
  <div class="search-box"><input id="searchInput" type="text" placeholder="Search banks, groceries, buses…"></div>
</div>

<main id="root"></main>

<button class="home-btn" id="homeBtn" title="Back to top">⌂</button>

<script>
/* ==================== Device / app store helpers ==================== */
function detectOS(){
  const ua = navigator.userAgent || navigator.vendor || window.opera || '';
  if(/iPad|iPhone|iPod/.test(ua) && !window.MSStream) return 'ios';
  if(/android/i.test(ua)) return 'android';
  return 'desktop';
}
const OS = detectOS();
function appStoreUrl(appName){ return `https://apps.apple.com/us/search?term=${encodeURIComponent(appName)}`; }
function playStoreUrl(appName){ return `https://play.google.com/store/search?q=${encodeURIComponent(appName)}&c=apps`; }
function routeProvider(url, app){
  if(url.startsWith('tel:')){ window.location.href = url; return; }
  if(OS === 'ios' && app){ window.open(appStoreUrl(app), '_blank'); return; }
  if(OS === 'android' && app){ window.open(playStoreUrl(app), '_blank'); return; }
  window.open(url, '_blank');
}
function initials(name){
  const clean = name.replace(/[^A-Za-z0-9 ]/g,'').trim();
  const parts = clean.split(/\s+/).filter(Boolean);
  if(parts.length === 0) return '#';
  if(parts.length === 1) return parts[0].slice(0,2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

/* ==================== Region detection ==================== */
const POSTCODE_2LETTER = {ls:'leeds', bs:'bristol', ng:'nottingham', eh:'edinburgh', ne:'newcastle', cf:'cardiff', bt:'belfast', ec:'london', wc:'london', nw:'london', se:'london', sw:'london'};
const POSTCODE_1LETTER = {m:'manchester', b:'birmingham', l:'liverpool', g:'glasgow', s:'sheffield', n:'london', e:'london', w:'london'};
const CITY_NAME_MAP = [
  ['london','london'],['nottingham','nottingham'],['manchester','manchester'],['birmingham','birmingham'],
  ['leeds','leeds'],['bristol','bristol'],['liverpool','liverpool'],['glasgow','glasgow'],['edinburgh','edinburgh'],
  ['sheffield','sheffield'],['newcastle','newcastle'],['cardiff','cardiff'],['belfast','belfast'],
  ['coventry','birmingham'],['leicester','birmingham'],['derby','birmingham'],['wolverhampton','birmingham'],
  ['york','leeds'],['hull','leeds'],['preston','manchester'],['bolton','manchester'],
  ['aberdeen','edinburgh'],['dundee','edinburgh'],['swansea','cardiff']
];
const REGION_LABELS = {
  london:'London', manchester:'Greater Manchester', nottingham:'Nottingham', birmingham:'West Midlands',
  leeds:'West Yorkshire', bristol:'Bristol & West of England', liverpool:'Liverpool City Region',
  glasgow:'Glasgow', edinburgh:'Edinburgh', sheffield:'South Yorkshire', newcastle:'Tyne & Wear',
  cardiff:'Cardiff', belfast:'Belfast'
};

function detectRegion(loc){
  if(!loc) return null;
  const raw = loc.trim();
  const pcMatch = raw.toUpperCase().match(/^([A-Z]{1,2})\d/);
  if(pcMatch){
    const letters = pcMatch[1].toLowerCase();
    if(letters.length === 2 && POSTCODE_2LETTER[letters]) return POSTCODE_2LETTER[letters];
    const first1 = letters[0];
    if(POSTCODE_1LETTER[first1]) return POSTCODE_1LETTER[first1];
  }
  const lower = raw.toLowerCase();
  for(const [name, region] of CITY_NAME_MAP){ if(lower.includes(name)) return region; }
  return null;
}

/* ==================== Transport data ==================== */
const TRANSPORT_UNIVERSAL = [

const TRANSPORT_REGIONAL = {

  ],

  ],
  cardiff:[{name:"Cardiff Bus", tag:"Local operator", url:"https://www.cardiffbus.com", app:"Cardiff Bus", desc:"Main bus operator in and around Cardiff."}],
  belfast:[{name:"Translink", tag:"Regional operator", url:"https://www.translink.co.uk", app:"Translink NI", desc:"Runs Belfast's Metro buses, Glider and regional trains."}]
};
function getBusProviders(region){
  const regional = region && TRANSPORT_REGIONAL[region] ? TRANSPORT_REGIONAL[region] : [];
  return [...regional, ...TRANSPORT_UNIVERSAL];
}

/* ==================== Indian mission data ==================== */
const EMBASSIES = {
  london:{name:"High Commission of India, London", address:"India House, Aldwych, London WC2B 4NA", url:"https://www.hcilondon.gov.in"},
  birmingham:{name:"Consulate General of India, Birmingham", address:"20 Augusta Street, Jewellery Quarter, Birmingham B18 6JL", url:"https://cgibirmingham.gov.in"},
  edinburgh:{name:"Consulate General of India, Edinburgh", address:"17 Rutland Square, Edinburgh EH1 2BB", url:"https://www.cgiedinburgh.gov.in"},
  manchester:{name:"Consulate General of India, Manchester", address:"", url:"https://www.hcilondon.gov.in/page/consulates-in-uk/"},
  belfast:{name:"Consulate General of India, Belfast", address:"", url:"https://www.hcilondon.gov.in/page/consulates-in-uk/"},
  cardiff:{name:"Honorary Consulate of India, Cardiff", address:"", url:"https://www.hcilondon.gov.in/page/consulates-in-uk/"}
};
const REGION_TO_EMBASSY = {
  london:'london', edinburgh:'edinburgh', glasgow:'edinburgh',
  birmingham:'birmingham', nottingham:'birmingham', leicester:'birmingham', coventry:'birmingham',
  manchester:'manchester', liverpool:'manchester', leeds:'manchester', sheffield:'manchester', newcastle:'manchester',
  belfast:'belfast', cardiff:'cardiff'
};
function getEmbassyProviders(region){
  const nearestKey = (region && REGION_TO_EMBASSY[region]) || 'london';
  return Object.keys(EMBASSIES).map(key => {
    const e = EMBASSIES[key];
    return {
      name:e.name, tag: key===nearestKey ? 'Nearest for you' : 'Mission', tagNear: key===nearestKey,
      url:e.url, app:"", desc: key===nearestKey ? "Your closest mission based on the area you entered — confirm jurisdiction before visiting." : "",
      addr: e.address
    };
  }).sort((a,b) => (b.tagNear === true) - (a.tagNear === true));
}

/* ==================== Location-aware "find near me" ==================== */
function buildFindUrl(type, query, loc){
  const q = loc ? `${query} ${loc} UK` : `${query} UK`;
  if(type === 'maps') return `https://www.google.com/maps/search/${encodeURIComponent(q)}`;
  if(type === 'facebook') return `https://www.facebook.com/search/groups/?q=${encodeURIComponent((loc||'UK') + ' ' + query)}`;
  if(type === 'airbnb') return `https://www.airbnb.co.uk/s/${encodeURIComponent(loc||'United-Kingdom')}/homes`;
  return `https://www.google.com/search?q=${encodeURIComponent(q)}`;
}

/* ==================== Chapters -> Tasks ==================== */
const CHAPTERS = [

/* ==================== Render ==================== */
const root = document.getElementById('root');

function providerHtml(p){
  const cardClass = p.tagNear ? 'provider nearest' : 'provider';
  return `
    <div class="${cardClass}" data-url="${p.url}" data-app="${p.app||''}" data-search="${p.name.toLowerCase()}">
      <div class="p-icon">${initials(p.name)}</div>
      <div><div class="p-name">${p.name}</div>${p.tag ? `<div class="p-tag">${p.tag}</div>` : ''}</div>
    </div>
  `;
}

function taskCardHtml(task, loc, region){
  const searchBits = [task.title, ...(task.providers||[]).map(p=>p.name)].join(' ').toLowerCase();

  if(task.customHtml){
    return `
      <section class="task-card" data-search="${searchBits}">
        <div class="task-head" data-toggle>
          <div class="task-icon">${task.icon}</div>
          <div><h3>${task.title}</h3><p class="deck">${task.deck}</p></div>
          <div class="chev">⌄</div>
        </div>
        <div class="task-body">${task.customHtml}</div>
      </section>`;
  }

  let providers = task.providers || [];
  let regionTagHtml = '';
  if(task.dynamicProviders === 'bus'){
    providers = getBusProviders(region);
    regionTagHtml = region
      ? `<div class="region-tag">📍 ${REGION_LABELS[region] || region}</div>`
      : `<div class="region-tag generic">📍 Set your city above</div>`;
  }
  if(task.dynamicProviders === 'embassy'){
    providers = getEmbassyProviders(region);
    regionTagHtml = region
      ? `<div class="region-tag">📍 Nearest for ${loc}</div>`
      : `<div class="region-tag generic">📍 Set your city above</div>`;
  }

  const providersHtml = providers.map(providerHtml).join('');
  const findHtml = task.findType
    ? `<a class="find-btn" href="${buildFindUrl(task.findType, task.findQuery, loc)}" target="_blank" rel="noopener">🔎 Near ${loc || 'you'}</a>`
    : '';
  const tipHtml = task.tip ? `<div class="tip">💡 ${task.tip}</div>` : '';
  const allSearchBits = [searchBits, ...providers.map(p=>p.name.toLowerCase())].join(' ');

  return `
    <section class="task-card" data-search="${allSearchBits}">
      <div class="task-head" data-toggle>
        <div class="task-icon">${task.icon}</div>
        <div><h3>${task.title}</h3><p class="deck">${task.deck}</p></div>
        <div class="chev">⌄</div>
      </div>
      <div class="task-body">
        ${regionTagHtml}
        ${findHtml}
        <div class="provider-grid">${providersHtml}</div>
        ${tipHtml}
      </div>
    </section>
  `;
}

function render(loc){
  const region = detectRegion(loc);
  root.innerHTML = '';
  CHAPTERS.forEach(ch => {
    const chapterEl = document.createElement('div');
    chapterEl.className = 'chapter';
    chapterEl.id = ch.id;
    chapterEl.innerHTML = `
      <div class="chapter-node">${ch.node}</div>
      <div class="chapter-eyebrow">${ch.eyebrow}</div>
      <h2 class="chapter-title">${ch.title}</h2>
      <div class="tasks-holder">${ch.tasks.map(t => taskCardHtml(t, loc, region)).join('')}</div>
    `;
    root.appendChild(chapterEl);
  });

  const first = root.querySelector('.task-card');
  if(first) first.classList.add('open');

  root.querySelectorAll('[data-toggle]').forEach(head => {
    head.addEventListener('click', () => head.closest('.task-card').classList.toggle('open'));
  });

  root.querySelectorAll('.provider').forEach(el => {
    el.addEventListener('click', () => routeProvider(el.dataset.url, el.dataset.app));
  });
}

let currentLoc = '';
render(currentLoc);

/* ---- Location: input -> pill with change ---- */
const cityInput = document.getElementById('cityInput');
const stampBtn = document.getElementById('stampBtn');
const locateBox = document.getElementById('locateBox');
const locationPill = document.getElementById('locationPill');
const pillCity = document.getElementById('pillCity');
const changeBtn = document.getElementById('changeBtn');

function applyCity(){
  currentLoc = cityInput.value.trim();
  render(currentLoc);
  applySearch();
  if(currentLoc){
    pillCity.textContent = currentLoc;
    locateBox.style.display = 'none';
    locationPill.classList.add('show');
  } else {
    locateBox.style.display = 'flex';
    locationPill.classList.remove('show');
  }
}
stampBtn.addEventListener('click', applyCity);
cityInput.addEventListener('keydown', e => { if(e.key === 'Enter') applyCity(); });
changeBtn.addEventListener('click', () => {
  locationPill.classList.remove('show');
  locateBox.style.display = 'flex';
  cityInput.value = currentLoc;
  cityInput.focus();
});

/* ---- Search filter ---- */
const searchInput = document.getElementById('searchInput');
function applySearch(){
  const q = searchInput.value.trim().toLowerCase();
  document.querySelectorAll('.chapter').forEach(chapterEl => {
    let anyVisible = false;
    chapterEl.querySelectorAll('.task-card').forEach(card => {
      const match = !q || (card.dataset.search || '').includes(q);
      card.style.display = match ? '' : 'none';
      if(match) anyVisible = true;
      if(match && q) card.classList.add('open');
    });
    chapterEl.style.display = anyVisible ? '' : 'none';
  });
}
searchInput.addEventListener('input', applySearch);

/* ---- Home button ---- */
const homeBtn = document.getElementById('homeBtn');
window.addEventListener('scroll', () => {
  homeBtn.classList.toggle('show', window.scrollY > 400);
});
homeBtn.addEventListener('click', () => window.scrollTo({top:0, behavior:'smooth'}));
</script>
</body>
